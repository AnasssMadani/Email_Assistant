name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  legacy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legacy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: NODE_OPTIONS="--max-old-space-size=4096" node ./node_modules/typescript/bin/tsc --noEmit
      - run: npm test

  platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No Supabase/Postgres service here — packages/db's own tests would need a
      # real Postgres (see packages/db/README.md); this stage covers everything
      # that doesn't touch a live database (typecheck across all workspaces, plus
      # packages/core's pure-function unit tests: prefilter, template engine).
      #
      # `npm run build` (root package.json) is the single source of truth for
      # build order — it builds packages one at a time via `-w`, in dependency
      # order, NOT `npm run build --workspaces` (that runs targets concurrently
      # and can start a dependent before its dependency's dist/ output exists —
      # this is exactly what broke the first Render deploy of this monorepo).
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck --workspaces --if-present
      - run: npm test -w packages/core
